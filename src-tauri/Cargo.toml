[package]
name = "devstack-visualizer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Analyze project codebases and generate interactive architecture diagrams"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
walkdir = "2"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
petgraph = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
