[package]
name = "devstack-visualizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "devstack"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
petgraph = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
